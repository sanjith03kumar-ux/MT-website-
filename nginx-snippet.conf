# ============================================================
# Mama Roma — performance config (nginx version)
# Only use this if your host runs nginx (not Apache/cPanel). Ask your
# hosting provider which one applies, or check for a control panel that
# looks like cPanel (Apache) vs a raw VPS/DigitalOcean/managed nginx setup.
# Paste this inside your existing `server { ... }` block for the site.
# ============================================================

# ---- Compression ----
gzip on;
gzip_types text/html text/css application/javascript application/json
           image/svg+xml application/xml text/plain;
gzip_min_length 512;

# If your nginx build includes the Brotli module (check with your host):
# brotli on;
# brotli_types text/html text/css application/javascript application/json image/svg+xml;

# ---- Browser caching ----
location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|mp4|woff2|woff)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~* \.(css|js)$ {
    expires 30d;
    add_header Cache-Control "public";
}

location ~* \.html$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
}
