<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mama Roma | Website Under Development</title>
<style>
  body {
    margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    background:#1a1a1a; color:#f4e5c2; font-family:Georgia, serif; text-align:center;
  }
  .logo { width:min(420px, 82vw); height:auto; margin-bottom:20px; }
  h1 { font-size: 2rem; margin-bottom:10px; }
  p { color:#ccc; }
  #preloader {
    position:fixed; inset:0; z-index:10; display:flex; align-items:center;
    justify-content:center; background:#1a1a1a; opacity:1; visibility:visible;
    transition:opacity .35s ease, visibility .35s ease;
  }
  #preloader.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  .preloader-content { display:flex; flex-direction:column; align-items:center; }
  .preloader-logo { width:min(420px, 82vw); height:auto; animation:pulseLogo 1.5s ease-in-out infinite; }
  .preloader-bar { width:220px; height:2px; margin-top:8px; overflow:hidden; background:rgba(244,229,194,.25); }
  .preloader-fill { height:100%; width:0; background:#e8b84a; animation:fillBar 1.4s ease forwards; }
  @keyframes pulseLogo { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.72; transform:scale(.97); } }
  @keyframes fillBar { to { width:100%; } }
</style>
</head>
<body>
  <div id="preloader" aria-label="Loading Mama Roma">
    <div class="preloader-content">
      <img src="image/logo-transparent.png" alt="Mama Roma" class="preloader-logo">
      <div class="preloader-bar"><div class="preloader-fill"></div></div>
    </div>
  </div>
  <div>
    <img src="image/logo-transparent.png" alt="Mama Roma" class="logo">
    <h1>Mama Roma</h1>
    <p>Our website is currently under development.<br>We'll be back soon!</p>
  </div>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.getElementById('preloader').classList.add('hidden');
      }, 1400);
    }, { once: true });
  </script>
</body>
</html>
